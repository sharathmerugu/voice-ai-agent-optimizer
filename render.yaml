# Render blueprint. Importing this repo as a Blueprint provisions the service
# with these settings; the four secrets below are entered in the dashboard.
services:
  - type: web
    name: voice-ai-agent-optimizer
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      # Without this the service falls back to files, which do not survive a
      # free-tier restart — losing every install and every cached analysis.
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: voice-ai-optimizer-store
          property: connectionString

# Installs and cached analyses. An analysis costs three model calls and several
# minutes, so losing the cache on restart means paying for it again on the next
# visit — and losing the installs means a user is told to reinstall an app they
# already have.
keyValue:
  - name: voice-ai-optimizer-store
    plan: free
    ipAllowList: []
      # Developer Portal > your app > Advanced Settings > Auth
      - key: GHL_CLIENT_ID
        sync: false
      - key: GHL_CLIENT_SECRET
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
